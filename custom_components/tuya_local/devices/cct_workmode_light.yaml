name: CCT light (work_mode based)
entities:
  - entity: light
    class: light
    dps:
      # Power - DP ID: 1
      - id: 1
        type: boolean
        name: switch

      # Brightness - DP ID: 3
      # Brightness Mapping Table: 50 -> 20%, 100 -> 40%, 203 -> 80%, 255 -> 100%
      - id: 3
        type: integer
        name: brightness
        range:
          min: 10
          max: 1000


      # Color temperature (0–1000 → Kelvin) - DP ID: 4
      - id: 4
        type: integer
        name: color_temp
        range:
          min: 0
          max: 1000
        mapping:
          - target_range:
              min: 2700
              max: 6500

      # Work mode (internal, not exposed directly to HA) - DP ID: 2
      - id: 2
        type: string
        name: _work_mode
        hidden: true
